name: Publish Cerberus Casdoor image

on:
  push:
    branches:
      - "codex/casdoor-security-*"
    paths:
      - ".github/workflows/cerberus-image.yml"
      - "Dockerfile.cerberus"
      - "**/*.go"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read
  packages: write

concurrency:
  group: cerberus-casdoor-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish-amd64:
    name: Build and publish linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_TAG: ghcr.io/buzaslan129/casdoor-cockroach:4.27.1-cerberus.1-${{ github.sha }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Cerberus security invariants
        run: >-
          go test -mod=readonly ./object ./controllers
          -run 'TestApplicationIsSignupAllowedForBindsOrganization|TestSafeAdapter|TestCerberusSecurity'
          -count=1

      - name: Compile every Go package
        run: go test -mod=readonly -tags skipCi -run '^$' ./...

      - name: Start the owned disposable CockroachDB
        shell: bash
        run: |
          set -euo pipefail
          echo '127.0.0.1 casdoor-safe-adapter-crdb' | sudo tee -a /etc/hosts >/dev/null
          docker run --detach --name casdoor-safe-adapter-crdb --network host --memory 2g \
            cockroachdb/cockroach@sha256:a0a144676e1648929f2838c3574d2ac02f1d29186f66207fc0149c7f3f9bcb6d \
            start-single-node --insecure --listen-addr=127.0.0.1:26257 \
            --http-addr=127.0.0.1:18080 --store=type=mem,size=1GiB \
            --cache=256MiB --max-sql-memory=512MiB
          for attempt in {1..60}; do
            if docker exec casdoor-safe-adapter-crdb /cockroach/cockroach sql \
              --insecure --host=127.0.0.1:26257 --execute='SELECT 1' >/dev/null 2>&1; then
              break
            fi
            if [[ ${attempt} -eq 60 ]]; then
              echo '::error::Disposable CockroachDB did not become ready'
              exit 1
            fi
            sleep 1
          done
          docker exec casdoor-safe-adapter-crdb /cockroach/cockroach sql \
            --insecure --host=127.0.0.1:26257 \
            --execute='CREATE DATABASE casdoor_safe_adapter_test'

      - name: Verify SafeAdapter against disposable CockroachDB
        env:
          CASDOOR_COCKROACH_TEST_ALLOW_DISPOSABLE: casdoor-safe-adapter-crdb
          CASDOOR_COCKROACH_TEST_DSN: postgresql://root@casdoor-safe-adapter-crdb:26257/casdoor_safe_adapter_test?sslmode=disable
        run: >-
          go test -mod=readonly -tags integration ./object
          -run '^TestSafeAdapterCockroachRepeatedWritesPreserveCustomTable$'
          -count=1

      - name: Stop the owned disposable CockroachDB
        if: always()
        run: docker rm --force casdoor-safe-adapter-crdb >/dev/null 2>&1 || true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace an existing source tag
        shell: bash
        run: |
          set -euo pipefail
          set +e
          inspect_output="$(docker buildx imagetools inspect "${IMAGE_TAG}" 2>&1)"
          inspect_status=$?
          set -e
          if [[ ${inspect_status} -eq 0 ]]; then
            echo "::error::Refusing to replace existing image tag ${IMAGE_TAG}"
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|not found|name unknown' <<<"${inspect_output}"; then
            printf '%s\n' "${inspect_output}" >&2
            echo "::error::Could not prove that ${IMAGE_TAG} is unused"
            exit 1
          fi

      - name: Build and publish the source-tagged image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.cerberus
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=4.27.1-cerberus.1
          cache-from: type=gha,scope=cerberus-casdoor-amd64
          cache-to: type=gha,mode=max,scope=cerberus-casdoor-amd64
          provenance: mode=max
          sbom: true

      - name: Verify and record the digest-pinned deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build returned an invalid image digest"
            exit 1
          fi
          remote_digest="$(docker buildx imagetools inspect "${IMAGE_TAG}" | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ "${remote_digest}" != "${IMAGE_DIGEST}" ]]; then
            echo "::error::Published digest does not match the build output"
            exit 1
          fi
          printf '### Digest-pinned deployment reference\n\n`%s@%s`\n' "${IMAGE_TAG%%:*}" "${IMAGE_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
