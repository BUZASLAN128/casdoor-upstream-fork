name: Publish Cerberus Casdoor image

on:
  push:
    branches:
      - "codex/casdoor-security-*"
    paths:
      - ".github/workflows/cerberus-image.yml"
      - "Dockerfile.cerberus"
      - "**/*.go"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read
  packages: write

concurrency:
  group: cerberus-casdoor-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-amd64:
    name: Build and publish linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.cerberus
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/buzaslan129/casdoor-cockroach:4.27.1-cerberus.1-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=4.27.1-cerberus.1
          cache-from: type=gha,scope=cerberus-casdoor-amd64
          cache-to: type=gha,mode=max,scope=cerberus-casdoor-amd64
          provenance: mode=max
          sbom: true

      - name: Record the immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '### Image digest\n\n`%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
